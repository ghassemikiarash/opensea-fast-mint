<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenSea Live Drops Gateway</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --blue: #2f81f7;
      --green: #238636;
      --tag-ended: #30363d;
      --tag-live: #238636;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .wrapper { width: 100%; max-width: 1200px; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .btn {
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn-connect { background: var(--green); color: #fff; }
    .btn-refresh { background: #21262d; color: var(--text); margin-left: 8px; }
    .btn-refresh:hover { background: #30363d; }

    .app-layout {
      display: grid;
      grid-template-columns: 290px 1.4fr 1fr;
      gap: 20px;
    }
    @media (max-width: 1024px) {
      .app-layout { grid-template-columns: 1fr; }
    }

    /* سایدبار دراپ‌ها */
    .sidebar-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .col-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      transition: 0.2s;
    }
    .col-card:hover, .col-card.active {
      border-color: var(--blue);
      background: #1c2128;
    }
    .col-card img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
    }
    .col-card-info h4 { margin: 0 0 4px 0; font-size: 0.95rem; }
    .network-pill {
      display: inline-block;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .chain-ethereum { background: #3c3c3d; color: #fff; }
    .chain-base { background: #0052ff22; color: #0052ff; border: 1px solid #0052ff44; }
    .chain-polygon { background: #8247e522; color: #a855f7; border: 1px solid #8247e544; }
    .chain-arbitrum { background: #28a0f022; color: #28a0f0; border: 1px solid #28a0f044; }

    /* ستون جزئیات */
    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 18px;
    }
    .hero-banner {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
      background: #21262d;
    }
    .hero-details {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: -40px;
    }
    .avatar-img {
      width: 80px;
      height: 80px;
      border-radius: 12px;
      border: 3px solid var(--card-bg);
      object-fit: cover;
      background: #161b22;
    }
    .hero-text h2 { margin: 0 0 4px 0; font-size: 1.3rem; }

    /* زمان‌بندی فازها */
    .schedule-box { display: flex; flex-direction: column; gap: 10px; }
    .stage-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: 0.2s;
    }
    .stage-item:hover, .stage-item.selected {
      border-color: var(--blue);
      background: #1a202c;
    }
    .stage-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .stage-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: bold;
    }
    .badge-ended { background: var(--tag-ended); color: var(--muted); }
    .badge-live { background: var(--tag-live); color: #fff; }
    .stage-time { font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
    .stage-foot {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #21262d;
      font-size: 0.8rem;
    }

    /* پنل مینت */
    .mint-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      height: fit-content;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      font-size: 0.85rem;
    }
    .info-row span:first-child { color: var(--muted); }
    .info-row span:last-child { font-weight: bold; }
    .qty-input {
      width: 100%;
      padding: 10px;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      box-sizing: border-box;
      margin-top: 6px;
      text-align: center;
      font-size: 1rem;
    }
    .btn-mint {
      width: 100%;
      padding: 14px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 14px;
    }
    .btn-mint:disabled { background: #21262d; color: var(--muted); cursor: not-allowed; }
    #status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: none;
      word-break: break-all;
    }
    .success { background: #1b472c; color: #7ee787; }
    .error { background: #4c1d24; color: #ff7b72; }
    .info { background: #1f3557; color: #79c0ff; }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="top-bar">
      <div>
        <h2 style="margin: 0; color: var(--blue);">OpenSea Drops Live Hub ⚡</h2>
        <small style="color: var(--muted);">همگام‌سازی مستقیم و زنده شبکه و فازهای دراپ</small>
      </div>
      <div>
        <button class="btn btn-refresh" onclick="fetchLiveDrops()">بروزرسانی زنده 🔄</button>
        <button id="connectBtn" class="btn btn-connect" onclick="connectWallet()">اتصال کیف پول</button>
        <span id="walletAddress" style="font-size: 0.75rem; color: var(--muted); margin-right: 8px;"></span>
      </div>
    </div>

    <div class="app-layout">
      <!-- ستون ۱: لیست کالکشن‌ها -->
      <div>
        <h3 style="margin: 0 0 12px 0; font-size: 1rem;">کالکشن‌های لحظه‌ای</h3>
        <div class="sidebar-list" id="collectionsContainer">
          <div style="color: var(--muted); padding: 10px;">در حال همگام‌سازی با اوپن‌سی...</div>
        </div>
      </div>

      <!-- ستون ۲: مشخصات و فازها -->
      <div>
        <div class="hero-card">
          <img id="bannerImg" class="hero-banner" src="" alt="Banner" />
          <div class="hero-details">
            <img id="avatarImg" class="avatar-img" src="" alt="Avatar" />
            <div class="hero-text">
              <h2 id="colName">-</h2>
              <span id="colChainBadge" class="network-pill chain-ethereum">-</span>
              <p id="colContract" style="margin: 4px 0 0 0; color: var(--muted); font-size: 0.75rem; font-family: monospace;"></p>
            </div>
          </div>
        </div>

        <h3 style="margin: 0 0 12px 0; font-size: 1rem;">Mint schedule</h3>
        <div class="schedule-box" id="scheduleContainer"></div>
      </div>

      <!-- ستون ۳: کنترلر مینت و سوئیچ شبکه -->
      <div class="mint-card">
        <h3 style="margin-top: 0;">پنل تسویه و مینت مستقیم</h3>

        <div class="info-row">
          <span>شبکه مورد نیاز:</span>
          <span id="targetNetworkDisplay" style="color: var(--blue);">-</span>
        </div>
        <div class="info-row">
          <span>فاز انتخابی:</span>
          <span id="selectedStageName">-</span>
        </div>
        <div class="info-row">
          <span>قیمت هر واحد:</span>
          <span id="selectedStagePrice">-</span>
        </div>
        <div class="info-row">
          <span>سقف هر ولت:</span>
          <span id="selectedStageLimit">-</span>
        </div>

        <div style="margin-top: 12px;">
          <label style="font-size: 0.8rem; color: var(--muted);">تعداد برای مینت:</label>
          <input type="number" id="mintQty" class="qty-input" value="1" min="1" max="20" oninput="calculateTotal()" />
        </div>

        <div class="info-row" style="margin-top: 14px; font-size: 1rem;">
          <span>مجموع پرداختی:</span>
          <span id="totalCost" style="color: var(--blue);">0 ETH</span>
        </div>

        <button id="mintBtn" class="btn-mint" onclick="executeMint()" disabled>کیف پول وصل نیست</button>
        <div id="status"></div>
      </div>
    </div>
  </div>

  <script>
    // جدول چین‌آیدی و تنظیمات دقیق شبکه‌ها برای تعویض خودکار متامسک
    const CHAINS = {
      ETHEREUM: { id: 1, hex: "0x1", name: "Ethereum", symbol: "ETH" },
      BASE: { 
        id: 8453, 
        hex: "0x2105", 
        name: "Base", 
        symbol: "ETH",
        rpcUrls: ["https://mainnet.base.org"],
        blockExplorerUrls: ["https://basescan.org"]
      },
      MATIC: { 
        id: 137, 
        hex: "0x89", 
        name: "Polygon", 
        symbol: "MATIC",
        rpcUrls: ["https://polygon-rpc.com"],
        blockExplorerUrls: ["https://polygonscan.com"]
      },
      ARBITRUM: { 
        id: 42161, 
        hex: "0xa4b1", 
        name: "Arbitrum", 
        symbol: "ETH",
        rpcUrls: ["https://arb1.arbitrum.io/rpc"],
        blockExplorerUrls: ["https://arbiscan.io"]
      },
      OPTIMISM: { 
        id: 10, 
        hex: "0xa", 
        name: "Optimism", 
        symbol: "ETH",
        rpcUrls: ["https://mainnet.optimism.io"],
        blockExplorerUrls: ["https://optimistic.etherscan.io"]
      }
    };

    const SEADROP_ADDRESS = "0x00005EA00Ac477B1030CE7850649666545161545";
    const SEADROP_ABI = [
      "function mintPublic(address nftContract, address feeRecipient, address minterIfNotPayer, uint256 quantity) payable"
    ];

    let dropsData = [];
    let currentCollection = null;
    let currentStage = null;
    let provider, signer, userAddress;

    // دریافت داده‌های لایو اوپن‌سی از فانکشن کلادفلر
    async function fetchLiveDrops() {
      showStatus("در حال استخراج آخرین دراپ‌های زنده از OpenSea...", "info");
      try {
        const res = await fetch("/api/drops");
        const json = await res.json();
        
        const rawEdges = json.data?.drops?.edges || [];
        if (rawEdges.length === 0) throw new Error("داده‌ای از دراپ‌ها دریافت نشد.");

        dropsData = rawEdges.map(edge => {
          const n = edge.node;
          const chainKey = (n.chain || "ETHEREUM").toUpperCase();
          const chainInfo = CHAINS[chainKey] || CHAINS.ETHEREUM;

          const stages = (n.mintStages?.edges || []).map(s => {
            const st = s.node;
            const now = Math.floor(Date.now() / 1000);
            const start = st.startTime ? Math.floor(new Date(st.startTime).getTime() / 1000) : 0;
            const end = st.endTime ? Math.floor(new Date(st.endTime).getTime() / 1000) : 0;
            
            let status = "Live now";
            if (end && now > end) status = "Ended";
            else if (start && now < start) status = "Upcoming";

            const rawPrice = parseFloat(st.price?.unit || "0");
            return {
              name: st.name || "Stage",
              type: st.stageType || "Public",
              status: status,
              time: `Starts: ${st.startTime ? new Date(st.startTime).toLocaleDateString("fa-IR") : "نامشخص"}`,
              price: rawPrice,
              priceText: rawPrice === 0 ? "Free" : `${rawPrice} ${st.price?.symbol || chainInfo.symbol}`,
              limit: st.perWalletLimit || 10,
              eligible: status === "Live now"
            };
          });

          return {
            id: n.id,
            name: n.name || n.slug,
            chainInfo: chainInfo,
            contract: n.contractAddress || "0x39aB24564c785Fe687dF7265F5E052d9213812d4",
            banner: n.bannerImageUrl || "https://picsum.photos/900/200",
            avatar: n.imageUrl || "https://picsum.photos/100/100",
            schedule: stages.length ? stages : [{
              name: "Public stage",
              type: "Public",
              status: "Live now",
              time: "فعال در شبکه",
              price: 0.003,
              priceText: `0.003 ${chainInfo.symbol}`,
              limit: 10,
              eligible: true
            }]
          };
        });

        renderCollections();
        selectCollection(0);
        showStatus("اطلاعات تمام دراپ‌ها با موفقیت همگام شد ✓", "success");
      } catch (err) {
        // فال‌بک به داده‌های ذخیره شده در صورت قطعی API
        console.warn("API Error, loading cache:", err);
        loadFallbackData();
      }
    }

    function loadFallbackData() {
      dropsData = [
        {
          id: "chomp",
          name: "Chomp",
          chainInfo: CHAINS.ETHEREUM,
          contract: "0x39aB24564c785Fe687dF7265F5E052d9213812d4",
          banner: "https://i.seadn.io/gcs/files/3b5db3ebcc93c83690d0b04ea0cb13c3.png?auto=format&dpr=1&w=1920",
          avatar: "https://i.seadn.io/gcs/files/ad0118eb3d4432247be9cff98c935472.png?auto=format&dpr=1&w=384",
          schedule: [
            { name: "Team", type: "Allowlist", status: "Ended", time: "Started: September 6", price: 0, priceText: "Free", limit: 100, eligible: false },
            { name: "GTD", type: "Allowlist", status: "Ended", time: "Started: September 6", price: 0.003, priceText: "0.003 ETH", limit: 5, eligible: false },
            { name: "WL FCFS", type: "Allowlist", status: "Ended", time: "Started: September 6", price: 0.003, priceText: "0.003 ETH", limit: 5, eligible: false },
            { name: "Public stage", type: "Public", status: "Live now", time: "Ends: September 7, 2027", price: 0.003, priceText: "0.003 ETH", limit: 20, eligible: true }
          ]
        },
        {
          id: "base-drop",
          name: "Base Legends",
          chainInfo: CHAINS.BASE,
          contract: "0x77777772dec96b997fa44b82d49942a781037777",
          banner: "https://picsum.photos/seed/base/900/200",
          avatar: "https://picsum.photos/seed/basea/100/100",
          schedule: [
            { name: "Base Early", type: "Allowlist", status: "Ended", time: "Expired", price: 0.001, priceText: "0.001 ETH", limit: 2, eligible: false },
            { name: "Public Stage", type: "Public", status: "Live now", time: "Ends in 2 days", price: 0.002, priceText: "0.002 ETH", limit: 10, eligible: true }
          ]
        }
      ];
      renderCollections();
      selectCollection(0);
    }

    function renderCollections() {
      const container = document.getElementById("collectionsContainer");
      container.innerHTML = "";

      dropsData.forEach((col, idx) => {
        const item = document.createElement("div");
        item.className = `col-card ${currentCollection && col.id === currentCollection.id ? 'active' : ''}`;
        item.onclick = () => selectCollection(idx);

        const chainClass = `chain-${col.chainInfo.name.toLowerCase()}`;
        item.innerHTML = `
          <img src="${col.avatar}" alt="${col.name}" onerror="this.src='https://picsum.photos/50/50'" />
          <div class="col-card-info">
            <h4>${col.name}</h4>
            <span class="network-pill ${chainClass}">${col.chainInfo.name}</span>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function selectCollection(index) {
      currentCollection = dropsData[index];
      currentStage = currentCollection.schedule.find(s => s.status === "Live now") || currentCollection.schedule[0];

      document.getElementById("bannerImg").src = currentCollection.banner;
      document.getElementById("avatarImg").src = currentCollection.avatar;
      document.getElementById("colName").innerText = currentCollection.name;
      
      const badge = document.getElementById("colChainBadge");
      badge.innerText = currentCollection.chainInfo.name;
      badge.className = `network-pill chain-${currentCollection.chainInfo.name.toLowerCase()}`;
      
      document.getElementById("targetNetworkDisplay").innerText = currentCollection.chainInfo.name;
      document.getElementById("colContract").innerText = currentCollection.contract;

      renderCollections();
      renderSchedule();
      updateSelectedStageUI();
    }

    function renderSchedule() {
      const container = document.getElementById("scheduleContainer");
      container.innerHTML = "";

      currentCollection.schedule.forEach((stage) => {
        const item = document.createElement("div");
        const isSelected = currentStage && stage.name === currentStage.name;
        item.className = `stage-item ${isSelected ? 'selected' : ''}`;
        item.onclick = () => {
          currentStage = stage;
          renderSchedule();
          updateSelectedStageUI();
        };

        item.innerHTML = `
          <div class="stage-top">
            <div>
              <strong>${stage.name}</strong>
              <small style="color: var(--muted); margin-right: 6px;">${stage.type}</small>
            </div>
            <span class="stage-badge ${stage.status === 'Live now' ? 'badge-live' : 'badge-ended'}">${stage.status}</span>
          </div>
          <div class="stage-time">${stage.time}</div>
          <div class="stage-foot">
            <span><strong>${stage.priceText}</strong> | سقف: ${stage.limit}</span>
            <span class="eligibility ${stage.eligible ? 'eligible' : 'not-eligible'}">
              ${stage.eligible ? 'مجاز ✓' : 'غیرمجاز'}
            </span>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function updateSelectedStageUI() {
      if (!currentStage) return;
      document.getElementById("selectedStageName").innerText = currentStage.name;
      document.getElementById("selectedStagePrice").innerText = currentStage.priceText;
      document.getElementById("selectedStageLimit").innerText = `${currentStage.limit} برای هر ولت`;
      document.getElementById("mintQty").max = currentStage.limit;
      calculateTotal();
    }

    function calculateTotal() {
      if (!currentStage) return;
      const qty = parseInt(document.getElementById("mintQty").value) || 1;
      const total = (qty * currentStage.price).toFixed(4);
      document.getElementById("totalCost").innerText = `${total} ${currentCollection.chainInfo.symbol}`;
    }

    // بررسی و تغییر خودکار شبکه در متامسک متناسب با دراپ
    async function ensureCorrectNetwork() {
      const targetChain = currentCollection.chainInfo;
      const currentChainId = await window.ethereum.request({ method: "eth_chainId" });

      if (parseInt(currentChainId, 16) !== targetChain.id) {
        showStatus(`در حال تغییر شبکه متامسک به ${targetChain.name}...`, "info");
        try {
          await window.ethereum.request({
            method: "wallet_switchEthereumChain",
            params: [{ chainId: targetChain.hex }]
          });
        } catch (switchError) {
          // اگر شبکه در ولت کاربر وجود نداشت، اضافه شود
          if (switchError.code === 4902 && targetChain.rpcUrls) {
            await window.ethereum.request({
              method: "wallet_addEthereumChain",
              params: [{
                chainId: targetChain.hex,
                chainName: targetChain.name,
                nativeCurrency: { name: targetChain.symbol, symbol: targetChain.symbol, decimals: 18 },
                rpcUrls: targetChain.rpcUrls,
                blockExplorerUrls: targetChain.blockExplorerUrls
              }]
            });
          } else {
            throw switchError;
          }
        }
      }
    }

    async function connectWallet() {
      if (!window.ethereum) {
        alert("لطفاً افزونه کیف پول (متامسک یا رابین‌هود ولت) را نصب کنید.");
        return;
      }
      try {
        provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        userAddress = await signer.getAddress();

        document.getElementById("walletAddress").innerText = userAddress.slice(0, 6) + "..." + userAddress.slice(-4);
        document.getElementById("connectBtn").innerText = "متصل شد";
        document.getElementById("connectBtn").style.background = "#21262d";

        const mintBtn = document.getElementById("mintBtn");
        mintBtn.disabled = false;
        mintBtn.innerText = "مینت فوری از SeaDrop ⚡";
      } catch (err) {
        showStatus("خطا در ولت: " + err.message, "error");
      }
    }

    async function executeMint() {
      if (!signer) return;
      if (currentStage.status === "Ended") {
        showStatus("این فاز تمام شده است. فاز لایو را انتخاب کنید.", "error");
        return;
      }

      const qty = parseInt(document.getElementById("mintQty").value);
      const totalValue = ethers.utils.parseEther((qty * currentStage.price).toString());

      try {
        // ۱. ابتدا تطبیق شبکه صورت می‌گیرد
        await ensureCorrectNetwork();

        showStatus("ارسال مستقیم تراکنش به پروتکل SeaDrop...", "info");
        const seaDrop = new ethers.Contract(SEADROP_ADDRESS, SEADROP_ABI, signer);

        const tx = await seaDrop.mintPublic(
          currentCollection.contract,
          ethers.constants.AddressZero,
          ethers.constants.AddressZero,
          qty,
          { value: totalValue }
        );

        showStatus("تراکنش در شبکه ثبت شد! هش: " + tx.hash, "info");
        await tx.wait();
        showStatus("مینت با موفقیت انجام شد! 🎉", "success");
      } catch (err) {
        showStatus("خطا در تراکنش: " + (err.reason || err.message), "error");
      }
    }

    function showStatus(msg, type) {
      const el = document.getElementById("status");
      el.className = type;
      el.innerText = msg;
      el.style.display = "block";
    }

    // بارگذاری اولیه
    fetchLiveDrop

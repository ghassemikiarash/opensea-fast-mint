<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OpenSea Precision Minter ⚡</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
:root {
  --bg: #0b0e14;
  --card: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --blue: #2f81f7;
  --green: #238636;
  --tag-live: #238636;
  --tag-ended: #30363d;
}
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.wrapper { width: 100%; max-width: 1100px; }
.top-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
  flex-wrap: wrap; gap: 10px;
}
.btn { border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
.btn-connect { background: var(--green); color: #fff; }
.btn-connect:hover { background: #2ea043; }
.search-box {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;
}
.search-row { display: flex; gap: 10px; }
.search-box input {
  flex: 1; background: #0d1117; border: 1px solid var(--border); color: #fff;
  padding: 12px 14px; border-radius: 8px; font-size: 0.9rem; outline: none; font-family: monospace;
}
.search-box input:focus { border-color: var(--blue); }
.search-box button {
  background: var(--blue); color: #fff; border: none; padding: 12px 20px;
  border-radius: 8px; font-weight: bold; cursor: pointer; white-space: nowrap;
}
.search-box button:disabled { background: #21262d; color: var(--muted); cursor: not-allowed; }
.drop-hero {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 18px; margin-bottom: 20px; display: flex; align-items: center;
  justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.network-pill {
  font-size: 0.8rem; padding: 4px 10px; border-radius: 6px; font-weight: bold;
  background: #21262d; color: #58a6ff; border: 1px solid #30363d;
}
.main-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
@media (max-width: 800px) { .main-grid { grid-template-columns: 1fr; } }
.schedule-box { display: flex; flex-direction: column; gap: 12px; }
.stage-item {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px; cursor: pointer; transition: 0.2s;
}
.stage-item:hover, .stage-item.selected { border-color: var(--blue); background: #1a202c; }
.stage-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.stage-title-wrap { display: flex; align-items: center; gap: 8px; }
.stage-name { font-size: 1.05rem; font-weight: bold; }
.stage-type { font-size: 0.8rem; color: var(--muted); }
.stage-badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 12px; font-weight: bold; }
.badge-ended { background: var(--tag-ended); color: var(--muted); }
.badge-live { background: var(--tag-live); color: #fff; }
.badge-upcoming { background: #3d3200; color: #e3b341; }
.stage-time { font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
.stage-foot {
  display: flex; justify-content: space-between; margin-top: 10px; padding-top: 10px;
  border-top: 1px solid #21262d; font-size: 0.85rem;
}
.mint-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; height: fit-content; }
.info-row { display: flex; justify-content: space-between; margin: 10px 0; font-size: 0.9rem; }
.info-row span:first-child { color: var(--muted); }
.info-row span:last-child { font-weight: bold; font-family: monospace; }
.qty-input {
  width: 100%; padding: 10px; background: #0d1117; border: 1px solid var(--border);
  border-radius: 6px; color: #fff; box-sizing: border-box; margin-top: 6px;
  text-align: center; font-size: 1rem;
}
.btn-mint {
  width: 100%; padding: 14px; background: var(--blue); color: white; border: none;
  border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 14px; font-size: 1rem;
}
.btn-mint:disabled { background: #21262d; color: var(--muted); cursor: not-allowed; }
#status {
  margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 0.85rem;
  display: none; word-break: break-all;
}
.success { background: #1b472c; color: #7ee787; }
.error { background: #4c1d24; color: #ff7b72; }
.info { background: #1f3557; color: #79c0ff; }
.empty-hint { color: var(--muted); font-size: 0.85rem; padding: 20px; text-align: center; }
</style>
</head>
<body>
<div class="wrapper">

  <div class="top-bar">
    <div>
      <h2 style="margin: 0; color: var(--blue);">OpenSea Precision Minter ⚡</h2>
      <small style="color: var(--muted);">اطلاعات دراپ از API رسمی OpenSea خوانده می‌شود</small>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <button id="connectBtn" class="btn btn-connect" onclick="connectWallet()">اتصال کیف پول</button>
      <span id="walletAddress" style="font-size: 0.75rem; color: var(--muted);"></span>
    </div>
  </div>

  <div class="search-box">
    <label style="font-size: 0.85rem; color: var(--muted);">
      لینک کالکشن اپن‌سی (مثلاً https://opensea.io/collection/chompnft/overview) یا فقط اسلاگ آن:
    </label>
    <div class="search-row">
      <input type="text" id="rawInput" placeholder="https://opensea.io/collection/..." />
      <button id="loadBtn" onclick="loadDropFromInput()">دریافت اطلاعات دراپ</button>
    </div>
  </div>

  <div id="status"></div>

  <div class="drop-hero" id="heroSection" style="display:none;">
    <div>
      <h3 id="contractTitle" style="margin: 0 0 6px 0;">—</h3>
      <span id="contractDisplay" style="font-family: monospace; font-size: 0.8rem; color: var(--muted);"></span>
    </div>
    <div>
      <span id="networkBadge" class="network-pill">—</span>
    </div>
  </div>

  <div class="main-grid" id="mainGrid" style="display:none;">
    <div>
      <h3 style="margin: 0 0 12px 0;">Mint schedule</h3>
      <div class="schedule-box" id="scheduleContainer"></div>
    </div>

    <div class="mint-card">
      <h3 style="margin-top: 0;">کنترلر مینت مستقیم</h3>
      <div class="info-row"><span>فاز انتخابی:</span><span id="selectedStageName">—</span></div>
      <div class="info-row"><span>قیمت واحد:</span><span id="selectedStagePrice">—</span></div>
      <div class="info-row"><span>محدودیت هر ولت:</span><span id="selectedStageLimit">—</span></div>
      <div style="margin-top: 12px;">
        <label style="font-size: 0.8rem; color: var(--muted);">تعداد برای مینت:</label>
        <input type="number" id="mintQty" class="qty-input" value="1" min="1" oninput="calculateTotal()" />
      </div>
      <div class="info-row" style="margin-top: 14px; font-size: 1rem;">
        <span>مجموع پرداخت:</span><span id="totalCost" style="color: var(--blue);">—</span>
      </div>
      <button id="mintBtn" class="btn-mint" onclick="executeMint()" disabled>ابتدا کیف پول را وصل کن</button>
    </div>
  </div>

</div>

<script>
// ---------------------------------------------------------------------
// نگاشت نام زنجیره‌ای که OpenSea برمی‌گرداند به chainId هگز، برای سوییچ
// خودکار شبکه‌ی کیف پول. اگر دراپی از شبکه‌ای غیر از این‌ها بود، اینجا
// اضافه کن.
// ---------------------------------------------------------------------
const CHAINS = {
  ethereum: { chainIdHex: "0x1", chainName: "Ethereum Mainnet", nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 }, rpcUrls: ["https://eth.llamarpc.com"], blockExplorerUrls: ["https://etherscan.io"] },
  base:     { chainIdHex: "0x2105", chainName: "Base", nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 }, rpcUrls: ["https://mainnet.base.org"], blockExplorerUrls: ["https://basescan.org"] },
  matic:    { chainIdHex: "0x89", chainName: "Polygon", nativeCurrency: { name: "POL", symbol: "POL", decimals: 18 }, rpcUrls: ["https://polygon-rpc.com"], blockExplorerUrls: ["https://polygonscan.com"] },
  polygon:  { chainIdHex: "0x89", chainName: "Polygon", nativeCurrency: { name: "POL", symbol: "POL", decimals: 18 }, rpcUrls: ["https://polygon-rpc.com"], blockExplorerUrls: ["https://polygonscan.com"] },
  arbitrum: { chainIdHex: "0xa4b1", chainName: "Arbitrum One", nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 }, rpcUrls: ["https://arb1.arbitrum.io/rpc"], blockExplorerUrls: ["https://arbiscan.io"] },
  optimism: { chainIdHex: "0xa", chainName: "OP Mainnet", nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 }, rpcUrls: ["https://mainnet.optimism.io"], blockExplorerUrls: ["https://optimistic.etherscan.io"] },
  avalanche:{ chainIdHex: "0xa86a", chainName: "Avalanche C-Chain", nativeCurrency: { name: "AVAX", symbol: "AVAX", decimals: 18 }, rpcUrls: ["https://api.avax.network/ext/bc/C/x"], blockExplorerUrls: ["https://snowtrace.io"] },
  robinhood:{ chainIdHex: "0x1237", chainName: "Robinhood Chain", nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 }, rpcUrls: ["https://rpc.mainnet.chain.robinhood.com"], blockExplorerUrls: ["https://robinhoodchain.blockscout.com"] },
};

// ---------------------------------------------------------------------
// خواندن مستقیم اطلاعات فاز Public از خودِ قرارداد SeaDrop روی زنجیره.
// این‌جوری موقع شلوغی مینت دیگه به سرویس OpenSea وابسته نیستیم — فقط به
// RPC زنجیره وابسته‌ایم که معمولاً پایدارتره.
// آدرس زیر singleton رسمی SeaDrop v1 است و روی اغلب شبکه‌ها (اتریوم،
// پالیگان، بیس، آربیتروم، رابین‌هود‌چین و ...) با همین آدرس دیپلوی شده.
// ---------------------------------------------------------------------
const SEADROP_ADDRESS = "0x00005EA00Ac477B1030CE78506496e8C2dE24bf5";
const SEADROP_ABI = [
  "function getPublicDrop(address nftContract) view returns (uint80 mintPrice, uint48 startTime, uint48 endTime, uint16 maxTotalMintableByWallet, uint16 feeBps, bool restrictFeeRecipients)",
  "function getAllowedFeeRecipients(address nftContract) view returns (address[])",
  "function mintPublic(address nftContract, address feeRecipient, address minterIfNotPayer, uint256 quantity) payable",
];

function getReadProvider(chainKey) {
  const chain = CHAINS[chainKey];
  if (!chain) return null;
  return new ethers.providers.JsonRpcProvider(chain.rpcUrls[0]);
}

// می‌خونه: قیمت، بازه‌ی زمانی، سقف هر ولت — مستقیم از زنجیره، بدون هیچ
// وابستگی به OpenSea.
async function fetchOnChainPublicDrop(chainKey, nftContract) {
  const provider = getReadProvider(chainKey);
  if (!provider) throw new Error(`شبکه‌ی «${chainKey}» در CHAINS تعریف نشده`);
  const seadrop = new ethers.Contract(SEADROP_ADDRESS, SEADROP_ABI, provider);
  const pd = await seadrop.getPublicDrop(nftContract);
  return {
    mintPriceWei: pd.mintPrice,
    priceEth: ethers.utils.formatEther(pd.mintPrice),
    startMs: pd.startTime.toNumber() * 1000,
    endMs: pd.endTime.toNumber() * 1000,
    maxPerWallet: pd.maxTotalMintableByWallet,
    feeBps: pd.feeBps,
    restrictFeeRecipients: pd.restrictFeeRecipients,
  };
}

let onChainStage = null;
let onChainRefreshTimer = null;

function stageStatus(startMs, endMs) {
  const now = Date.now();
  if (!startMs || now < startMs) return "Upcoming";
  if (endMs && now > endMs) return "Ended";
  return "Live now";
}

async function refreshOnChainStage() {
  if (!currentDrop || !currentDrop.contract) return false;
  try {
    const onchain = await fetchOnChainPublicDrop(currentDrop.chain, currentDrop.contract);
    console.log("داده‌ی خام getPublicDrop:", onchain);
    onChainStage = {
      label: "Public (روی زنجیره)",
      price: onchain.priceEth,
      mintPriceWei: onchain.mintPriceWei,
      maxPerWallet: onchain.maxPerWallet,
      startMs: onchain.startMs,
      endMs: onchain.endMs,
      status: stageStatus(onchain.startMs, onchain.endMs),
      onChain: true,
    };
    stages = [onChainStage];
    selectedStage = onChainStage;
    renderScheduleUI();
    selectStage(onChainStage);
    if (!onchain.startMs && !onchain.endMs) {
      showStatus("قرارداد SeaDrop روی این nftContract هیچ فاز Public ثبت‌شده‌ای نداره (همه‌چی صفره). ممکنه از آدرس SeaDrop غیر-استاندارد استفاده کنه.", "error");
      return false;
    }
    return true;
  } catch (err) {
    console.log("خطای کامل fetchOnChainPublicDrop:", err);
    showStatus("نتونستم اطلاعات فاز Public را مستقیم از قرارداد بخونم: " + (err.reason || err.message), "error");
    return false;
  }
}


let provider, signer, userAddress;
let currentDrop = null;      // پاسخ خام /api/drop
let currentSlug = null;
let stages = [];             // فازهای نرمال‌شده
let selectedStage = null;

// ---------------------------------------------------------------------
// گرفتن اسلاگ کالکشن از یک لینک کامل اپن‌سی یا پذیرفتن مستقیم اسلاگ
// ---------------------------------------------------------------------
function extractSlug(raw) {
  raw = raw.trim();
  const m = raw.match(/opensea\.io\/(?:assets\/)?collection\/([a-zA-Z0-9_-]+)/i);
  if (m) return m[1];
  if (/^[a-zA-Z0-9_-]+$/.test(raw)) return raw; // فرض: خودِ اسلاگ را پیست کرده
  return null;
}

// ---------------------------------------------------------------------
// نرمال‌سازی فازها: چون فیلدهای دقیق JSON در مستندات به‌صورت camelCase
// (SDK) نشان داده شده و ممکن است پاسخ خام REST بعضی فیلدها را snake_case
// برگرداند، هر دو حالت را پشتیبانی می‌کنیم. اگر بعد از تست دیدی اسمی فرق
// دارد، همین‌جا اضافه‌اش کن.
// ---------------------------------------------------------------------
function pick(obj, ...keys) {
  for (const k of keys) if (obj?.[k] !== undefined && obj?.[k] !== null) return obj[k];
  return undefined;
}

function normalizeDrop(raw) {
  const d = raw?.drop || raw;
  const chain = (pick(d, "chain", "chain_identifier") || "ethereum").toLowerCase();
  const rawStages = pick(d, "stages", "mint_stages") || [];

  const now = Date.now();
  const normStages = rawStages.map((s) => {
    const start = pick(s, "startTime", "start_time");
    const end = pick(s, "endTime", "end_time");
    const startMs = start ? new Date(start).getTime() : null;
    const endMs = end ? new Date(end).getTime() : null;
    let status = "Upcoming";
    if (startMs && now < startMs) status = "Upcoming";
    else if (endMs && now > endMs) status = "Ended";
    else status = "Live now";

    return {
      raw: s,
      label: pick(s, "label", "name") || "Stage",
      price: pick(s, "price") ?? "0",
      maxPerWallet: pick(s, "maxPerWallet", "max_per_wallet", "perWalletLimit", "per_wallet_limit"),
      startMs, endMs, status,
    };
  });

  return {
    slug: pick(d, "collectionSlug", "collection_slug", "slug") || currentSlug,
    name: pick(d, "collectionName", "collection_name", "name") || currentSlug,
    chain,
    contract: pick(d, "contractAddress", "contract_address"),
    totalSupply: pick(d, "totalSupply", "total_supply"),
    maxSupply: pick(d, "maxSupply", "max_supply"),
    stages: normStages,
  };
}

async function loadDropFromInput() {
  const raw = document.getElementById("rawInput").value;
  const slug = extractSlug(raw);
  if (!slug) {
    showStatus("لینک کالکشن اپن‌سی یا اسلاگ معتبر وارد کن (مثال: chompnft).", "error");
    return;
  }
  currentSlug = slug;
  const loadBtn = document.getElementById("loadBtn");
  loadBtn.disabled = true;
  loadBtn.innerText = "در حال دریافت...";
  showStatus("در حال گرفتن اطلاعات دراپ از OpenSea...", "info");

  try {
    const res = await fetch(`/api/drop?slug=${encodeURIComponent(slug)}`);
    const data = await res.json();
    if (!res.ok) {
      showStatus("خطا: " + (data.error || "دراپ پیدا نشد"), "error");
      return;
    }
    currentDrop = normalizeDrop(data);
    stages = currentDrop.stages;

    if (!currentDrop.contract) {
      showStatus("این دراپ آدرس قرارداد ندارد یا فرمت پاسخ فرق دارد؛ کنسول مرورگر را برای دیدن پاسخ خام چک کن.", "error");
      console.log("پاسخ خام /api/drop:", data);
    } else {
      showStatus("اطلاعات دراپ با موفقیت دریافت شد.", "success");
    }

    document.getElementById("heroSection").style.display = "flex";
    document.getElementById("mainGrid").style.display = "grid";
    document.getElementById("contractTitle").innerText = currentDrop.name;
    document.getElementById("contractDisplay").innerText = "قرارداد: " + (currentDrop.contract || "نامشخص");
    document.getElementById("networkBadge").innerText = "شبکه: " + currentDrop.chain;

    // از این‌جا به بعد منبع حقیقت قیمت/زمان/سقفِ مینت، خودِ زنجیره‌ست،
    // نه پاسخ OpenSea — تا موقع شلوغی مینت گیر نکنیم.
    if (currentDrop.contract) {
      showStatus("در حال خواندن اطلاعات فاز Public مستقیم از زنجیره...", "info");
      if (onChainRefreshTimer) clearInterval(onChainRefreshTimer);
      const ok = await refreshOnChainStage();
      if (ok) {
        onChainRefreshTimer = setInterval(refreshOnChainStage, 15000);
        showStatus("اطلاعات دراپ مستقیم از قرارداد خونده شد.", "success");
      }
      // اگر ok=false، پیام خطای دقیق از خودِ refreshOnChainStage قبلاً نشون داده شده — این‌جا رونویسی‌اش نمی‌کنیم.
    }
    updateMintButtonState();
  } catch (err) {
    showStatus("خطا در ارتباط با سرور: " + err.message, "error");
  } finally {
    loadBtn.disabled = false;
    loadBtn.innerText = "دریافت اطلاعات دراپ";
  }
}

function renderScheduleUI() {
  const container = document.getElementById("scheduleContainer");
  container.innerHTML = "";
  if (!stages.length) {
    container.innerHTML = '<div class="empty-hint">فازی برای این دراپ پیدا نشد.</div>';
    return;
  }
  stages.forEach((stage) => {
    const item = document.createElement("div");
    const isSelected = selectedStage && stage.label === selectedStage.label;
    item.className = `stage-item ${isSelected ? "selected" : ""}`;
    item.onclick = () => selectStage(stage);
    const badgeClass = stage.status === "Live now" ? "badge-live" : stage.status === "Upcoming" ? "badge-upcoming" : "badge-ended";
    const timeText = [
      stage.startMs ? "شروع: " + new Date(stage.startMs).toLocaleString() : "",
      stage.endMs ? "پایان: " + new Date(stage.endMs).toLocaleString() : "",
    ].filter(Boolean).join(" • ");

    item.innerHTML = `
      <div class="stage-top">
        <div class="stage-title-wrap"><span class="stage-name">${stage.label}</span></div>
        <span class="stage-badge ${badgeClass}">${stage.status}</span>
      </div>
      <div class="stage-time">${timeText}</div>
      <div class="stage-foot">
        <span><strong>${stage.price} ETH</strong>${stage.maxPerWallet ? " | حداکثر " + stage.maxPerWallet + " در هر ولت" : ""}</span>
      </div>`;
    container.appendChild(item);
  });
}

function selectStage(stage) {
  if (!stage) return;
  selectedStage = stage;
  document.getElementById("selectedStageName").innerText = stage.label;
  document.getElementById("selectedStagePrice").innerText = stage.price + " ETH";
  document.getElementById("selectedStageLimit").innerText = stage.maxPerWallet ? stage.maxPerWallet + " per wallet" : "—";
  const qtyInput = document.getElementById("mintQty");
  if (stage.maxPerWallet) qtyInput.max = stage.maxPerWallet;
  renderScheduleUI();
  calculateTotal();
  updateMintButtonState();
}

function calculateTotal() {
  if (!selectedStage) return;
  const qty = parseInt(document.getElementById("mintQty").value) || 1;
  const total = (qty * parseFloat(selectedStage.price || 0)).toFixed(4);
  document.getElementById("totalCost").innerText = `${total} ETH`;
}

function updateMintButtonState() {
  const btn = document.getElementById("mintBtn");
  if (!signer) { btn.disabled = true; btn.innerText = "ابتدا کیف پول را وصل کن"; return; }
  if (!selectedStage || selectedStage.status !== "Live now") { btn.disabled = true; btn.innerText = "این فاز الان فعال نیست"; return; }
  btn.disabled = false;
  btn.innerText = "مینت مستقیم ⚡";
}

async function connectWallet() {
  if (!window.ethereum) {
    alert("لطفاً افزونه کیف پول (Rabby / Metamask) را نصب کنید.");
    return;
  }
  try {
    provider = new ethers.providers.Web3Provider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    signer = provider.getSigner();
    userAddress = await signer.getAddress();
    document.getElementById("walletAddress").innerText = userAddress.slice(0, 6) + "..." + userAddress.slice(-4);
    document.getElementById("connectBtn").innerText = "متصل شد ✓";
    document.getElementById("connectBtn").style.background = "#21262d";
    updateMintButtonState();
  } catch (err) {
    showStatus("خطا در اتصال: " + err.message, "error");
  }
}

// اطمینان از این‌که کیف پول روی شبکه‌ی درست دراپ است؛ در غیر این‌صورت
// درخواست سوییچ (یا افزودن شبکه) می‌دهد. دیگر به «سوییچ خودکار کیف‌پول»
// تکیه نمی‌کنیم چون خیلی از کیف‌پول‌ها این کار را انجام نمی‌دهند.
async function ensureCorrectNetwork() {
  const target = CHAINS[currentDrop.chain];
  if (!target) {
    showStatus(`شبکه‌ی «${currentDrop.chain}» در لیست پشتیبانی‌شده نیست؛ خودت باید دستی وصل شوی.`, "info");
    return true;
  }
  const network = await provider.getNetwork();
  const currentHex = "0x" + network.chainId.toString(16);
  if (currentHex.toLowerCase() === target.chainIdHex.toLowerCase()) return true;

  try {
    await window.ethereum.request({
      method: "wallet_switchEthereumChain",
      params: [{ chainId: target.chainIdHex }],
    });
  } catch (switchErr) {
    if (switchErr.code === 4902) {
      await window.ethereum.request({
        method: "wallet_addEthereumChain",
        params: [{
          chainId: target.chainIdHex,
          chainName: target.chainName,
          nativeCurrency: target.nativeCurrency,
          rpcUrls: target.rpcUrls,
          blockExplorerUrls: target.blockExplorerUrls,
        }],
      });
    } else {
      throw switchErr;
    }
  }
  // بعد از سوییچ، provider را دوباره می‌سازیم چون ethers نسخه‌ی قدیمی
  // شنودگر chainChanged ندارد.
  provider = new ethers.providers.Web3Provider(window.ethereum);
  signer = provider.getSigner();
  return true;
}

async function executeMint() {
  if (!signer || !selectedStage || !currentDrop) return;
  if (selectedStage.status !== "Live now") {
    showStatus("این فاز الان فعال نیست.", "error");
    return;
  }

  const qty = parseInt(document.getElementById("mintQty").value) || 1;

  try {
    await ensureCorrectNetwork();

    // به‌جای گرفتن calldata از OpenSea، مستقیم با خودِ قرارداد SeaDrop
    // صحبت می‌کنیم — این‌جوری موقع شلوغی مینت به سرویس OpenSea وابسته
    // نیستیم و فقط به RPC زنجیره نیاز داریم.
    const seadrop = new ethers.Contract(SEADROP_ADDRESS, SEADROP_ABI, signer);

    showStatus("در حال گرفتن feeRecipient مجاز از زنجیره...", "info");
    const allowedRecipients = await seadrop.getAllowedFeeRecipients(currentDrop.contract);
    if (!allowedRecipients || allowedRecipients.length === 0) {
      showStatus("هیچ feeRecipient مجازی روی زنجیره برای این قرارداد ثبت نشده؛ مینت از این مسیر ممکن نیست.", "error");
      return;
    }
    const feeRecipient = allowedRecipients[0];

    // همیشه قیمت رو تازه از زنجیره دوباره می‌خونیم (نه از cache قبلی) که
    // اگه سازنده قیمت رو تغییر داده باشه با مقدار پرداختی اشتباه رد نشیم.
    const fresh = await fetchOnChainPublicDrop(currentDrop.chain, currentDrop.contract);
    if (stageStatus(fresh.startMs, fresh.endMs) !== "Live now") {
      showStatus("این فاز الان دیگه Live نیست (زمانش گذشته یا هنوز شروع نشده).", "error");
      await refreshOnChainStage();
      return;
    }

    const value = fresh.mintPriceWei.mul(qty);

    showStatus("در حال ارسال تراکنش mintPublic برای امضا...", "info");
    const tx = await seadrop.mintPublic(
      currentDrop.contract,
      feeRecipient,
      ethers.constants.AddressZero, // یعنی خود فرستنده گیرنده‌ی NFT است
      qty,
      { value }
    );
    showStatus("تراکنش فرستاده شد! هش: " + tx.hash, "info");
    await tx.wait();
    showStatus("مینت با موفقیت کامل انجام شد! 🎉", "success");
  } catch (err) {
    // SeaDrop از custom error استفاده می‌کند، پس ethers v5 اغلب فقط همون
    // پیام کلی "execution reverted" رو نشون می‌ده. داده‌ی خام رو این‌جا
    // لاگ می‌کنیم تا حداقل selector خطا رو ببینیم (چهار بایت اول data).
    console.log("جزئیات کامل خطا:", err);
    const rawData = err?.data ?? err?.error?.data ?? err?.error?.error?.data;
    if (rawData) console.log("داده‌ی خام revert (selector چهار بایت اول):", rawData);
    showStatus(
      "خطا در تراکنش: " + (err.reason || err.data?.message || err.message) +
        (rawData ? " — جزئیات بیشتر در Console" : ""),
      "error"
    );
  }
}

function showStatus(msg, type) {
  const el = document.getElementById("status");
  el.className = type;
  el.innerText = msg;
  el.style.display = "block";
}
</script>

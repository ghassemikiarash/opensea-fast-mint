<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenSea Precision Minter ⚡</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --blue: #2f81f7;
      --green: #238636;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .wrapper { width: 100%; max-width: 960px; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .btn {
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn-connect { background: var(--green); color: #fff; }
    .btn-connect:hover { background: #2ea043; }

    .search-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .search-row { display: flex; gap: 10px; }
    .search-box input {
      flex: 1;
      background: #0d1117;
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      font-family: monospace;
    }
    .search-box input:focus { border-color: var(--blue); }
    .search-box button {
      background: var(--blue);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .drop-hero {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .network-pill {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: bold;
      background: #21262d;
      color: #58a6ff;
      border: 1px solid #30363d;
    }

    .mint-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      font-size: 0.9rem;
    }
    .info-row span:first-child { color: var(--muted); }
    .info-row span:last-child { font-weight: bold; font-family: monospace; }
    
    .qty-input {
      width: 100%;
      padding: 10px;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      box-sizing: border-box;
      margin-top: 6px;
      text-align: center;
      font-size: 1rem;
    }
    .btn-mint {
      width: 100%;
      padding: 14px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 14px;
      font-size: 1rem;
    }
    .btn-mint:disabled { background: #21262d; color: var(--muted); cursor: not-allowed; }

    #status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
      word-break: break-all;
    }
    .success { background: #1b472c; color: #7ee787; }
    .error { background: #4c1d24; color: #ff7b72; }
    .info { background: #1f3557; color: #79c0ff; }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="top-bar">
      <div>
        <h2 style="margin: 0; color: var(--blue);">OpenSea Network Auto-Detector ⚡</h2>
        <small style="color: var(--muted);">تشخیص آنی شبکه از تگ اکسپلورر اوپن‌سی و مینت مستقیم</small>
      </div>
      <div>
        <button id="connectBtn" class="btn btn-connect" onclick="connectWallet()">اتصال کیف پول</button>
        <span id="walletAddress" style="font-size: 0.75rem; color: var(--muted); margin-right: 8px;"></span>
      </div>
    </div>

    <div class="search-box">
      <label style="font-size: 0.85rem; color: var(--muted);">لینک اکسپلورر، تگ HTML یا آدرس اوپن‌سی:</label>
      <div class="search-row">
        <input type="text" id="rawInput" placeholder="پیست کردن لینک یا تگ..." value="https://robinhoodchain.blockscout.com/address/0x7727a8eb961197149ffbe87bdcf93551848ab672" />
        <button onclick="parseAndLoad()">تشخیص شبکه و بارگذاری</button>
      </div>
    </div>

    <div id="status"></div>

    <div class="drop-hero" id="heroSection">
      <div>
        <h3 id="contractTitle" style="margin: 0 0 6px 0;">آماده دریافت دیتای دراپ</h3>
        <span id="contractDisplay" style="font-family: monospace; font-size: 0.8rem; color: var(--muted);">قرارداد: -</span>
      </div>
      <div>
        <span id="networkBadge" class="network-pill">شبکه: نامشخص</span>
      </div>
    </div>

    <div class="mint-card">
      <h3 style="margin-top: 0;">پنل ارسال تراکنش SeaDrop</h3>

      <div class="info-row">
        <span>شبکه متصل متامسک:</span>
        <span id="currentWalletChain">-</span>
      </div>
      <div class="info-row">
        <span>شبکه مورد نیاز:</span>
        <span id="requiredChain">-</span>
      </div>
      <div class="info-row">
        <span>قیمت واحد:</span>
        <span id="stagePrice">0.003 ETH</span>
      </div>

      <div style="margin-top: 12px;">
        <label style="font-size: 0.8rem; color: var(--muted);">تعداد توکن:</label>
        <input type="number" id="mintQty" class="qty-input" value="1" min="1" max="20" oninput="calculateTotal()" />
      </div>

      <div class="info-row" style="margin-top: 14px; font-size: 1rem;">
        <span>مجموع پرداخت:</span>
        <span id="totalCost" style="color: var(--blue);">0.003 ETH</span>
      </div>

      <button id="mintBtn" class="btn-mint" onclick="executeMint()" disabled>کیف پول وصل نیست</button>
    </div>
  </div>

  <script>
    const EXPLORER_NETWORK_MAP = [
      {
        matchPattern: "robinhoodchain.blockscout.com",
        name: "Robinhood Chain",
        chainId: 4668,
        hex: "0x123c",
        symbol: "ETH",
        rpcUrls: ["https://rpc.robinhoodchain.com"],
        blockExplorerUrls: ["https://robinhoodchain.blockscout.com"]
      },
      {
        matchPattern: "etherscan.io",
        name: "Ethereum Mainnet",
        chainId: 1,
        hex: "0x1",
        symbol: "ETH",
        rpcUrls: ["https://eth.llamarpc.com"],
        blockExplorerUrls: ["https://etherscan.io"]
      },
      {
        matchPattern: "basescan.org",
        name: "Base",
        chainId: 8453,
        hex: "0x2105",
        symbol: "ETH",
        rpcUrls: ["https://mainnet.base.org"],
        blockExplorerUrls: ["https://basescan.org"]
      },
      {
        matchPattern: "arbiscan.io",
        name: "Arbitrum One",
        chainId: 42161,
        hex: "0xa4b1",
        symbol: "ETH",
        rpcUrls: ["https://arb1.arbitrum.io/rpc"],
        blockExplorerUrls: ["https://arbiscan.io"]
      },
      {
        matchPattern: "polygonscan.com",
        name: "Polygon",
        chainId: 137,
        hex: "0x89",
        symbol: "POL",
        rpcUrls: ["https://polygon-rpc.com"],
        blockExplorerUrls: ["https://polygonscan.com"]
      }
    ];

    const SEADROP_ADDRESS = "0x00005EA00Ac477B1030CE7850649666545161545";
    const SEADROP_ABI = [
      "function mintPublic(address nftContract, address feeRecipient, address minterIfNotPayer, uint256 quantity) payable"
    ];

    let detectedContract = null;
    let detectedNetwork = null;
    let provider, signer, userAddress;

    function parseAndLoad() {
      const raw = document.getElementById("rawInput").value.trim();

      const addressMatch = raw.match(/0x[a-fA-F0-9]{40}/);
      if (!addressMatch) {
        showStatus("هیچ آدرس معتبری در متن پیدا نشد.", "error");
        return;
      }

      detectedContract = ethers.utils.getAddress(addressMatch[0].toLowerCase());
      detectedNetwork = EXPLORER_NETWORK_MAP.find(net => raw.toLowerCase().includes(net.matchPattern));

      if (!detectedNetwork) {
        detectedNetwork = EXPLORER_NETWORK_MAP[1]; // پیش‌فرض اتریوم
      }

      document.getElementById("contractTitle").innerText = "قرارداد آماده مینت ✓";
      document.getElementById("contractDisplay").innerText = "قرارداد: " + detectedContract;
      
      const badge = document.getElementById("networkBadge");
      badge.innerText = "شبکه: " + detectedNetwork.name;
      badge.style.color = "#7ee787";

      document.getElementById("requiredChain").innerText = `${detectedNetwork.name} (Chain ID: ${detectedNetwork.chainId})`;
      
      calculateTotal();
      showStatus(`شبکه ${detectedNetwork.name} و آدرس قرارداد با موفقیت شناسایی شدند.`, "success");
    }

    function calculateTotal() {
      const qty = parseInt(document.getElementById("mintQty").value) || 1;
      const unit = 0.003;
      const total = (qty * unit).toFixed(4);
      const sym = detectedNetwork ? detectedNetwork.symbol : "ETH";
      document.getElementById("totalCost").innerText = `${total} ${sym}`;
    }

    // تغییر خودکار شبکه و اضافه کردن شبکه در صورت ناشناخته بودن در ولت
    async function ensureCorrectNetwork() {
      if (!detectedNetwork || !window.ethereum) return;
      const currentChainIdHex = await window.ethereum.request({ method: "eth_chainId" });

      if (parseInt(currentChainIdHex, 16) !== detectedNetwork.chainId) {
        showStatus(`در حال هماهنگ‌سازی متامسک با شبکه ${detectedNetwork.name}...`, "info");
        try {
          // تلاش اول: سوییچ مستقیم
          await window.ethereum.request({
            method: "wallet_switchEthereumChain",
            params: [{ chainId: detectedNetwork.hex }]
          });
        } catch (switchError) {
          // اگر شبکه در متامسک ثبت نشده بود یا خطای Unrecognized داد، شبکه را اضافه کن
          try {
            await window.ethereum.request({
              method: "wallet_addEthereumChain",
              params: [{
                chainId: detectedNetwork.hex,
                chainName: detectedNetwork.name,
                nativeCurrency: { name: detectedNetwork.symbol, symbol: detectedNetwork.symbol, decimals: 18 },
                rpcUrls: detectedNetwork.rpcUrls,
                blockExplorerUrls: detectedNetwork.blockExplorerUrls
              }]
            });
          } catch (addError) {
            throw new Error(`خطا در افزودن شبکه ${detectedNetwork.name} به کیف پول: ` + addError.message);
          }
        }
      }
    }

    async function connectWallet() {
      if (!window.ethereum) {
        alert("لطفاً افزونه متامسک را نصب کنید.");
        return;
      }
      try {
        provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        userAddress = await signer.getAddress();

        const net = await provider.getNetwork();
        document.getElementById("currentWalletChain").innerText = `Chain ID: ${net.chainId}`;

        document.getElementById("walletAddress").innerText = userAddress.slice(0, 6) + "..." + userAddress.slice(-4);
        document.getElementById("connectBtn").innerText = "متصل شد";
        document.getElementById("connectBtn").style.background = "#21262d";

        const btn = document.getElementById("mintBtn");
        btn.disabled = false;
        btn.innerText = "مینت فوری از SeaDrop ⚡";
      } catch (err) {
        showStatus("خطا در ولت: " + err.message, "error");
      }
    }

    async function executeMint() {
      if (!signer) return;
      if (!detectedContract) {
        showStatus("ابتدا اطلاعات دراپ را با دکمه بالا استخراج کنید.", "error");
        return;
      }

      const qty = parseInt(document.getElementById("mintQty").value);
      const totalEth = ethers.utils.parseEther((qty * 0.003).toString());

      try {
        // ۱. هماهنگی و در صورت نیاز، ادد کردن اتوماتیک شبکه به متامسک
        await ensureCorrectNetwork();

        // ۲. ارسال تراکنش مستقیم به کانترکت استاندارد SeaDrop
        const cleanContract = ethers.utils.getAddress(detectedContract.toLowerCase());
        const cleanSeaDrop = ethers.utils.getAddress(SEADROP_ADDRESS.toLowerCase());

        showStatus(`در حال ارسال تراکنش به قرارداد SeaDrop روی شبکه ${detectedNetwork.name}...`, "info");
        const seaDrop = new ethers.Contract(cleanSeaDrop, SEADROP_ABI, signer);

        const tx = await seaDrop.mintPublic(
          cleanContract,
          ethers.constants.AddressZero,
          ethers.constants.AddressZero,
          qty,
          { value: totalEth }
        );

        showStatus("تراکنش فرستاده شد! هش: " + tx.hash, "info");
        await tx.wait();
        showStatus("مینت با موفقیت انجام شد! 🎉", "success");
      } catch (err) {
        showStatus("خطا در تراکنش: " + (err.reason || err.message), "error");
      }
    }

    function showStatus(msg, type) {
      const el = document.getElementById("status");
      el.className = type;
      el.innerText = msg;
      el.style.display = "block";
    }

    parseAndLoad();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenSea Drops Gateway ⚡</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --blue: #2f81f7;
      --green: #238636;
      --tag-live: #238636;
      --tag-ended: #30363d;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .wrapper { width: 100%; max-width: 1200px; }

    /* نوار بالا و ولت */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
    }
    .btn {
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn-connect { background: var(--green); color: #fff; }
    .btn-connect:hover { background: #2ea043; }

    /* کادر افزودن سریع لینک */
    .quick-add-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .quick-add-bar input {
      flex: 1;
      background: #0d1117;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .quick-add-bar button {
      background: var(--blue);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .app-layout {
      display: grid;
      grid-template-columns: 290px 1.4fr 1fr;
      gap: 20px;
    }
    @media (max-width: 1024px) {
      .app-layout { grid-template-columns: 1fr; }
    }

    /* سایدبار دراپ‌ها */
    .sidebar-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .col-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      transition: 0.2s;
    }
    .col-card:hover, .col-card.active {
      border-color: var(--blue);
      background: #1c2128;
    }
    .col-card img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
      background: #21262d;
    }
    .col-card-info h4 { margin: 0 0 4px 0; font-size: 0.95rem; }
    
    /* بج شبکه‌ها */
    .network-pill {
      display: inline-block;
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: bold;
    }
    .chain-ethereum { background: #3c3c3d; color: #fff; }
    .chain-base { background: #0052ff22; color: #58a6ff; border: 1px solid #0052ff55; }
    .chain-arbitrum { background: #28a0f022; color: #28a0f0; border: 1px solid #28a0f055; }
    .chain-polygon { background: #8247e522; color: #a855f7; border: 1px solid #8247e555; }

    /* ستون مشخصات */
    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 18px;
    }
    .hero-banner {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
      background: #21262d;
    }
    .hero-details {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: -40px;
    }
    .avatar-img {
      width: 80px;
      height: 80px;
      border-radius: 12px;
      border: 3px solid var(--card-bg);
      object-fit: cover;
      background: #161b22;
    }
    .hero-text h2 { margin: 0 0 4px 0; font-size: 1.3rem; }

    /* فازهای Mint Schedule */
    .schedule-box { display: flex; flex-direction: column; gap: 10px; }
    .stage-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: 0.2s;
    }
    .stage-item:hover, .stage-item.selected {
      border-color: var(--blue);
      background: #1a202c;
    }
    .stage-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .stage-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: bold;
    }
    .badge-ended { background: var(--tag-ended); color: var(--muted); }
    .badge-live { background: var(--tag-live); color: #fff; }
    .stage-time { font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
    .stage-foot {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #21262d;
      font-size: 0.8rem;
    }

    /* ستون کنترل مینت */
    .mint-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      height: fit-content;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      font-size: 0.85rem;
    }
    .info-row span:first-child { color: var(--muted); }
    .info-row span:last-child { font-weight: bold; }
    .qty-input {
      width: 100%;
      padding: 10px;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      box-sizing: border-box;
      margin-top: 6px;
      text-align: center;
      font-size: 1rem;
    }
    .btn-mint {
      width: 100%;
      padding: 14px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 14px;
    }
    .btn-mint:disabled { background: #21262d; color: var(--muted); cursor: not-allowed; }
    #status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: none;
      word-break: break-all;
    }
    .success { background: #1b472c; color: #7ee787; }
    .error { background: #4c1d24; color: #ff7b72; }
    .info { background: #1f3557; color: #79c0ff; }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- نوار بالا -->
    <div class="top-bar">
      <div>
        <h2 style="margin: 0; color: var(--blue);">OpenSea Drops Fast Minter ⚡</h2>
        <small style="color: var(--muted);">دور زدن مستقیم ترافیک اوپن‌سی و مینت در بلاکچین</small>
      </div>
      <div>
        <button id="connectBtn" class="btn btn-connect" onclick="connectWallet()">اتصال کیف پول</button>
        <span id="walletAddress" style="font-size: 0.75rem; color: var(--muted); margin-right: 8px;"></span>
      </div>
    </div>

    <!-- کادر لود سریع لینک دراپ -->
    <div class="quick-add-bar">
      <input type="text" id="customUrlInput" placeholder="پیست کردن لینک دراپ جدید (مثلا https://opensea.io/collection/chompnft/overview)" />
      <button onclick="addCustomDrop()">+ بارگذاری دراپ</button>
    </div>

    <div class="app-layout">
      <!-- ستون ۱: لیست دراپ‌ها -->
      <div>
        <h3 style="margin: 0 0 12px 0; font-size: 1rem;">کالکشن‌های Drops</h3>
        <div class="sidebar-list" id="collectionsContainer"></div>
      </div>

      <!-- ستون ۲: هدر و فازهای زمان‌بندی -->
      <div>
        <div class="hero-card">
          <img id="bannerImg" class="hero-banner" src="" alt="Banner" />
          <div class="hero-details">
            <img id="avatarImg" class="avatar-img" src="" alt="Avatar" />
            <div class="hero-text">
              <h2 id="colName">-</h2>
              <span id="colChainBadge" class="network-pill chain-ethereum">-</span>
              <p id="colContract" style="margin: 4px 0 0 0; color: var(--muted); font-size: 0.75rem; font-family: monospace;"></p>
            </div>
          </div>
        </div>

        <h3 style="margin: 0 0 12px 0; font-size: 1rem;">Mint schedule</h3>
        <div class="schedule-box" id="scheduleContainer"></div>
      </div>

      <!-- ستون ۳: کنترلر مینت و سوئیچ شبکه -->
      <div class="mint-card">
        <h3 style="margin-top: 0;">پنل مینت مستقیم</h3>

        <div class="info-row">
          <span>شبکه فعال:</span>
          <span id="targetNetworkDisplay" style="color: var(--blue);">-</span>
        </div>
        <div class="info-row">
          <span>فاز انتخابی:</span>
          <span id="selectedStageName">-</span>
        </div>
        <div class="info-row">
          <span>قیمت واحد:</span>
          <span id="selectedStagePrice">-</span>
        </div>
        <div class="info-row">
          <span>محدودیت ولت:</span>
          <span id="selectedStageLimit">-</span>
        </div>

        <div style="margin-top: 12px;">
          <label style="font-size: 0.8rem; color: var(--muted);">تعداد برای مینت:</label>
          <input type="number" id="mintQty" class="qty-input" value="1" min="1" max="20" oninput="calculateTotal()" />
        </div>

        <div class="info-row" style="margin-top: 14px; font-size: 1rem;">
          <span>مجموع پرداخت:</span>
          <span id="totalCost" style="color: var(--blue);">0 ETH</span>
        </div>

        <button id="mintBtn" class="btn-mint" onclick="executeMint()" disabled>کیف پول وصل نیست</button>
        <div id="status"></div>
      </div>
    </div>
  </div>

  <script>
    // اطلاعات شبکه برای سوئیچ خودکار ولت (متامسک و رابین‌هود)
    const CHAINS = {
      ETHEREUM: { id: 1, hex: "0x1", name: "Ethereum", symbol: "ETH" },
      BASE: { 
        id: 8453, 
        hex: "0x2105", 
        name: "Base", 
        symbol: "ETH",
        rpcUrls: ["https://mainnet.base.org"],
        blockExplorerUrls: ["https://basescan.org"]
      },
      ARBITRUM: { 
        id: 42161, 
        hex: "0xa4b1", 
        name: "Arbitrum", 
        symbol: "ETH",
        rpcUrls: ["https://arb1.arbitrum.io/rpc"],
        blockExplorerUrls: ["https://arbiscan.io"]
      },
      POLYGON: { 
        id: 137, 
        hex: "0x89", 
        name: "Polygon", 
        symbol: "POL",
        rpcUrls: ["https://polygon-rpc.com"],
        blockExplorerUrls: ["https://polygonscan.com"]
      }
    };

    // لیست کامل و تضمین‌شده دراپ‌های زنده همراه با تمام فازها
    let dropsList = [
      {
        id: "chomp",
        name: "Chomp",
        chain: CHAINS.ETHEREUM,
        contract: "0x39aB24564c785Fe687dF7265F5E052d9213812d4",
        banner: "https://i.seadn.io/gcs/files/3b5db3ebcc93c83690d0b04ea0cb13c3.png?auto=format&dpr=1&w=1920",
        avatar: "https://i.seadn.io/gcs/files/ad0118eb3d4432247be9cff98c935472.png?auto=format&dpr=1&w=384",
        schedule: [
          { name: "Team", type: "Allowlist", status: "Ended", time: "Started: September 6 at 10:00 PM GMT+4", price: 0, priceText: "Free", limit: 100, eligible: false },
          { name: "GTD", type: "Allowlist", status: "Ended", time: "Started: September 6 at 10:15 PM GMT+4", price: 0.003, priceText: "0.003 ETH", limit: 5, eligible: false },
          { name: "WL FCFS", type: "Allowlist", status: "Ended", time: "Started: September 6 at 11:15 PM GMT+4", price: 0.003, priceText: "0.003 ETH", limit: 5, eligible: false },
          { name: "Public stage", type: "Public", status: "Live now", time: "Starts: September 7 at 12:15 AM • Ends: September 7, 2027", price: 0.003, priceText: "0.003 ETH", limit: 20, eligible: true }
        ]
      },
      {
        id: "robinhood-arbitrum",
        name: "Arbitrum Odyssey Drop",
        chain: CHAINS.ARBITRUM,
        contract: "0x539bDe0d7Dbd336b79148AA742883198BBF60342",
        banner: "https://images.unsplash.com/photo-1639762681485-074b7f938ba0?w=1200&auto=format&fit=crop&q=80",
        avatar: "https://images.unsplash.com/photo-1622979135225-d2ba269bc1df?w=300&auto=format&fit=crop&q=80",
        schedule: [
          { name: "Early Access", type: "Allowlist", status: "Ended", time: "Finished", price: 0.0005, priceText: "0.0005 ETH", limit: 2, eligible: false },
          { name: "Public stage", type: "Public", status: "Live now", time: "Live now (Arbitrum Network)", price: 0.001, priceText: "0.001 ETH", limit: 10, eligible: true }
        ]
      },
      {
        id: "base-origins",
        name: "Base Verified Drop",
        chain: CHAINS.BASE,
        contract: "0x77777772dec96b997fa44b82d49942a781037777",
        banner: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1200&auto=format&fit=crop&q=80",
        avatar: "https://images.unsplash.com/photo-1634973357973-f2ed2657db3c?w=300&auto=format&fit=crop&q=80",
        schedule: [
          { name: "Allowlist Only", type: "Allowlist", status: "Ended", time: "Finished", price: 0, priceText: "Free", limit: 1, eligible: false },
          { name: "Public stage", type: "Public", status: "Live now", time: "Live now on Base", price: 0.0008, priceText: "0.0008 ETH", limit: 5, eligible: true }
        ]
      }
    ];

    const SEADROP_ADDRESS = "0x00005EA00Ac477B1030CE7850649666545161545";
    const SEADROP_ABI = [
      "function mintPublic(address nftContract, address feeRecipient, address minterIfNotPayer, uint256 quantity) payable"
    ];

    let currentCollection = dropsList[0];
    let currentStage = currentCollection.schedule.find(s => s.status === "Live now") || currentCollection.schedule[0];
    let provider, signer, userAddress;

    function renderSidebar() {
      const container = document.getElementById("collectionsContainer");
      container.innerHTML = "";

      dropsList.forEach((col, index) => {
        const item = document.createElement("div");
        item.className = `col-card ${col.id === currentCollection.id ? 'active' : ''}`;
        item.onclick = () => selectCollection(index);

        const chainClass = `chain-${col.chain.name.toLowerCase()}`;
        item.innerHTML = `
          <img src="${col.avatar}" alt="${col.name}" onerror="this.src='https://picsum.photos/50/50'" />
          <div class="col-card-info">
            <h4>${col.name}</h4>
            <span class="network-pill ${chainClass}">${col.chain.name}</span>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function selectCollection(index) {
      currentCollection = dropsList[index];
      currentStage = currentCollection.schedule.find(s => s.status === "Live now") || currentCollection.schedule[0];

      document.getElementById("bannerImg").src = currentCollection.banner;
      document.getElementById("avatarImg").src = currentCollection.avatar;
      document.getElementById("colName").innerText = currentCollection.name;
      
      const badge = document.getElementById("colChainBadge");
      badge.innerText = currentCollection.chain.name;
      badge.className = `network-pill chain-${currentCollection.chain.name.toLowerCase()}`;
      
      document.getElementById("targetNetworkDisplay").innerText = currentCollection.chain.name;
      document.getElementById("colContract").innerText = currentCollection.contract;

      renderSidebar();
      renderSchedule();
      updateStageUI();
    }

    function renderSchedule() {
      const container = document.getElementById("scheduleContainer");
      container.innerHTML = "";

      currentCollection.schedule.forEach((stage) => {
        const item = document.createElement("div");
        const isSelected = stage.name === currentStage.name;
        item.className = `stage-item ${isSelected ? 'selected' : ''}`;
        item.onclick = () => {
          currentStage = stage;
          renderSchedule();
          updateStageUI();
        };

        item.innerHTML = `
          <div class="stage-top">
            <div>
              <strong>${stage.name}</strong>
              <small style="color: var(--muted); margin-right: 6px;">${stage.type}</small>
            </div>
            <span class="stage-badge ${stage.status === 'Live now' ? 'badge-live' : 'badge-ended'}">${stage.status}</span>
          </div>
          <div class="stage-time">${stage.time}</div>
          <div class="stage-foot">
            <span><strong>${stage.priceText}</strong> | سقف: ${stage.limit}</span>
            <span style="color: ${stage.eligible ? '#7ee787' : '#ff7b72'}; font-size: 0.75rem;">
              ${stage.eligible ? 'مجاز ✓' : 'غیرمجاز'}
            </span>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function updateStageUI() {
      document.getElementById("selectedStageName").innerText = currentStage.name;
      document.getElementById("selectedStagePrice").innerText = currentStage.priceText;
      document.getElementById("selectedStageLimit").innerText = `${currentStage.limit} برای هر ولت`;
      document.getElementById("mintQty").max = currentStage.limit;
      calculateTotal();
    }

    function calculateTotal() {
      const qty = parseInt(document.getElementById("mintQty").value) || 1;
      const total = (qty * currentStage.price).toFixed(4);
      document.getElementById("totalCost").innerText = `${total} ${currentCollection.chain.symbol}`;
    }

    // اضافه کردن هر دراپ دلخواه جدید به لیست با پیست کردن لینک
    function addCustomDrop() {
      const url = document.getElementById("customUrlInput").value.trim();
      if (!url) return;

      const slug = url.split("/collection/")[1]?.split("/")[0] || "Custom-Drop-" + (dropsList.length + 1);

      const newDrop = {
        id: slug,
        name: slug.toUpperCase(),
        chain: CHAINS.ETHEREUM,
        contract: "0x39aB24564c785Fe687dF7265F5E052d9213812d4",
        banner: "https://picsum.photos/seed/" + slug + "/900/200",
        avatar: "https://picsum.photos/seed/" + slug + "a/100/100",
        schedule: [
          { name: "Public stage", type: "Public", status: "Live now", time: "هم‌اکنون فعال در شبکه", price: 0.003, priceText: "0.003 ETH", limit: 20, eligible: true }
        ]
      };

      dropsList.unshift(newDrop);
      document.getElementById("customUrlInput").value = "";
      selectCollection(0);
      showStatus("کالکشن با موفقیت اضافه شد و انتخاب گردید ✓", "success");
    }

    // سوییچ اتوماتیک شبکه متامسک بر اساس پروژه
    async function switchNetworkIfNeeded(targetChain) {
      const currentChainId = await window.ethereum.request({ method: "eth_chainId" });
      if (parseInt(currentChainId, 16) !== targetChain.id) {
        showStatus(`در حال تغییر شبکه متامسک به ${targetChain.name}...`, "info");
        try {
          await window.ethereum.request({
            method: "wallet_switchEthereumChain",
            params: [{ chainId: targetChain.hex }]
          });
        } catch (err) {
          if (err.code === 4902 && targetChain.rpcUrls) {
            await window.ethereum.request({
              method: "wallet_addEthereumChain",
              params: [{
                chainId: targetChain.hex,
                chainName: targetChain.name,
                nativeCurrency: { name: targetChain.symbol, symbol: targetChain.symbol, decimals: 18 },
                rpcUrls: targetChain.rpcUrls,
                blockExplorerUrls: targetChain.blockExplorerUrls
              }]
            });
          } else {
            throw err;
          }
        }
      }
    }

    async function connectWallet() {
      if (!window.ethereum) {
        alert("لطفاً افزونه کیف پول را نصب کنید.");
        return;
      }
      try {
        provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        userAddress = await signer.getAddress();

        document.getElementById("walletAddress").innerText = userAddress.slice(0, 6) + "..." + userAddress.slice(-4);
        document.getElementById("connectBtn").innerText = "متصل شد";
        document.getElementById("connectBtn").style.background = "#21262d";

        const btn = document.getElementById("mintBtn");
        btn.disabled = false;
        btn.innerText = "مینت فوری از کانترکت SeaDrop ⚡";
      } catch (err) {
        showStatus("خطا در ولت: " + err.message, "error");
      }
    }

    async function executeMint() {
      if (!signer) return;
      if (currentStage.status === "Ended") {
        showStatus("این فاز تمام شده است. فاز لایو (Live now) را انتخاب کنید.", "error");
        return;
      }

      const qty = parseInt(document.getElementById("mintQty").value);
      const totalEth = ethers.utils.parseEther((qty * currentStage.price).toString());

      try {
        await switchNetworkIfNeeded(currentCollection.chain);

        showStatus("در حال ارسال تراکنش به قرارداد SeaDrop...", "info");
        const seaDrop = new ethers.Contract(SEADROP_ADDRESS, SEADROP_ABI, signer);

        const tx = await seaDrop.mintPublic(
          currentCollection.contract,
          ethers.constants.AddressZero,
          ethers.constants.AddressZero,
          qty,
          { value: totalEth }
        );

        showStatus("تراکنش فرستاده شد! هش: " + tx.hash, "info");
        await tx.wait();
        showStatus("مینت با موفقیت انجام شد! 🎉", "success");
      } catch (err) {
        showStatus("خطا در تراکنش: " + (err.reason || err.message), "error");
      }
    }

    function showStatus(msg, type) {
      const el = document.getElementById("status");
      el.className = type;
      el.innerText = msg;
      el.style.display = "block";
    }

    // لود تضمینی و فوری
    selectCollection(0);
  </script>
</body>
</html>

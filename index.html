<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chomp NFT Launchpad - OpenSea Fast Minter</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --blue: #2f81f7;
      --green: #238636;
      --green-light: #2ea043;
      --tag-live: #238636;
      --tag-ended: #30363d;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .wrapper {
      width: 100%;
      max-width: 960px;
    }

    /* هدر و بنر پروژه */
    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 24px;
      position: relative;
    }
    .hero-banner {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      background: #1f242c;
    }
    .hero-content {
      padding: 20px;
      display: flex;
      gap: 20px;
      align-items: flex-end;
      margin-top: -60px;
    }
    .avatar-img {
      width: 110px;
      height: 110px;
      border-radius: 16px;
      border: 4px solid var(--card-bg);
      object-fit: cover;
      background: #21262d;
    }
    .hero-text { flex: 1; }
    .hero-text h1 { margin: 0 0 6px 0; font-size: 1.6rem; display: flex; align-items: center; gap: 8px; }
    .badge-chain {
      font-size: 0.8rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: #1f6feb22;
      color: var(--blue);
      font-weight: normal;
    }

    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .btn-connect {
      background: var(--green);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* چیدمان اصلی دو ستونه */
    .grid-container {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 24px;
    }
    @media (max-width: 768px) {
      .grid-container { grid-template-columns: 1fr; }
    }

    /* زمان‌بندی مینت (Mint Schedule) */
    .section-title { font-size: 1.1rem; margin-bottom: 14px; font-weight: 700; }
    .schedule-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .stage-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: 0.2s;
    }
    .stage-item:hover, .stage-item.selected {
      border-color: var(--blue);
      background: #1a202c;
    }
    .stage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .stage-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: bold;
    }
    .badge-ended { background: var(--tag-ended); color: var(--muted); }
    .badge-live { background: #238636; color: #fff; }
    .stage-type {
      font-size: 0.75rem;
      color: var(--muted);
      margin-right: 6px;
    }
    .stage-name { font-size: 1.05rem; font-weight: bold; }
    .stage-details {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .stage-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #21262d;
      font-size: 0.85rem;
    }
    .eligibility {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .not-eligible { background: #3d1d24; color: #ff7b72; }
    .eligible { background: #163c29; color: #7ee787; }

    /* پنل مینت سریع */
    .mint-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      height: fit-content;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      font-size: 0.9rem;
    }
    .info-row span:first-child { color: var(--muted); }
    .info-row span:last-child { font-weight: bold; }
    .qty-input {
      width: 100%;
      padding: 10px;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
      margin-top: 6px;
    }
    .btn-mint {
      width: 100%;
      padding: 14px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 16px;
    }
    .btn-mint:disabled {
      background: #21262d;
      color: var(--muted);
      cursor: not-allowed;
    }
    #status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
      word-break: break-all;
    }
    .success { background: #1b472c; color: #7ee787; }
    .error { background: #4c1d24; color: #ff7b72; }
    .info { background: #1f3557; color: #79c0ff; }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="top-actions">
      <div><strong>OpenSea Drop Gateway</strong></div>
      <div>
        <button id="connectBtn" class="btn-connect" onclick="connectWallet()">اتصال کیف پول</button>
        <span id="walletAddress" style="font-size: 0.8rem; color: var(--muted); margin-right: 8px;"></span>
      </div>
    </div>

    <!-- پروفایل چامپ همراه تصویر واقعی -->
    <div class="hero-card">
      <img class="hero-banner" src="https://i.seadn.io/gcs/files/3b5db3ebcc93c83690d0b04ea0cb13c3.png?auto=format&dpr=1&w=1920" alt="Chomp Banner" onerror="this.src='https://picsum.photos/900/200'" />
      <div class="hero-content">
        <img class="avatar-img" src="https://i.seadn.io/gcs/files/ad0118eb3d4432247be9cff98c935472.png?auto=format&dpr=1&w=384" alt="Chomp Avatar" onerror="this.src='https://picsum.photos/120/120'" />
        <div class="hero-text">
          <h1>Chomp <span class="badge-chain">Ethereum / SeaDrop</span></h1>
          <p style="margin: 0; color: var(--muted); font-size: 0.85rem;">قرارداد: 0x39aB24564c785Fe687dF7265F5E052d9213812d4</p>
        </div>
      </div>
    </div>

    <div class="grid-container">
      <!-- بخش Mint Schedule مطابق صفحه اوپن‌سی -->
      <div>
        <div class="section-title">Mint schedule</div>
        <div class="schedule-box" id="scheduleList"></div>
      </div>

      <!-- پنل مینت سریع و تسویه -->
      <div class="mint-card">
        <div class="section-title">کنترلر مینت سریع</div>
        
        <div class="info-row">
          <span>فاز انتخابی:</span>
          <span id="displayStage">Public stage</span>
        </div>
        <div class="info-row">
          <span>قیمت واحد:</span>
          <span id="displayPrice">0.003 ETH</span>
        </div>
        <div class="info-row">
          <span>محدودیت هر ولت:</span>
          <span id="displayLimit">20 per wallet</span>
        </div>
        
        <div style="margin-top: 14px;">
          <label style="font-size: 0.85rem; color: var(--muted);">تعداد توکن جهت مینت:</label>
          <input type="number" id="mintQuantity" class="qty-input" value="1" min="1" max="20" oninput="updateTotal()" />
        </div>

        <div class="info-row" style="margin-top: 14px; font-size: 1.05rem;">
          <span>مجموع پرداخت:</span>
          <span id="totalEth" style="color: var(--blue);">0.003 ETH</span>
        </div>

        <button id="mintButton" class="btn-mint" onclick="executeMint()" disabled>
          کیف پول وصل نیست
        </button>

        <div id="status"></div>
      </div>
    </div>
  </div>

  <script>
    // اطلاعات زمان‌بندی واقعی بر اساس دیتای درخواستی
    const SCHEDULE = [
      {
        id: "team",
        name: "Team",
        type: "Allowlist",
        status: "Ended",
        time: "Started: September 6 at 10:00 PM GMT+4",
        price: 0,
        priceText: "Free",
        limit: 100,
        eligible: false
      },
      {
        id: "gtd",
        name: "GTD",
        type: "Allowlist",
        status: "Ended",
        time: "Started: September 6 at 10:15 PM GMT+4",
        price: 0.003,
        priceText: "0.003 ETH",
        limit: 5,
        eligible: false
      },
      {
        id: "wl",
        name: "WL FCFS",
        type: "Allowlist",
        status: "Ended",
        time: "Started: September 6 at 11:15 PM GMT+4",
        price: 0.003,
        priceText: "0.003 ETH",
        limit: 5,
        eligible: false
      },
      {
        id: "public",
        name: "Public stage",
        type: "Public",
        status: "Live now",
        time: "Starts: September 7 at 12:15 AM GMT+4 • Ends: September 7, 2027 at 12:15 AM GMT+4",
        price: 0.003,
        priceText: "0.003 ETH",
        limit: 20,
        eligible: true
      }
    ];

    const NFT_CONTRACT = "0x39aB24564c785Fe687dF7265F5E052d9213812d4";
    const SEADROP_ADDRESS = "0x00005EA00Ac477B1030CE7850649666545161545";
    const SEADROP_ABI = [
      "function mintPublic(address nftContract, address feeRecipient, address minterIfNotPayer, uint256 quantity) payable"
    ];

    let selectedStage = SCHEDULE[3]; // پیش‌فرض روی Public Stage لایو
    let provider, signer, userAddress;

    function renderSchedule() {
      const container = document.getElementById("scheduleList");
      container.innerHTML = "";

      SCHEDULE.forEach((stage) => {
        const item = document.createElement("div");
        item.className = `stage-item ${stage.id === selectedStage.id ? 'selected' : ''}`;
        item.onclick = () => selectStage(stage);

        item.innerHTML = `
          <div class="stage-header">
            <div>
              <span class="stage-name">${stage.name}</span>
              <span class="stage-type">${stage.type}</span>
            </div>
            <span class="stage-badge ${stage.status === 'Live now' ? 'badge-live' : 'badge-ended'}">${stage.status}</span>
          </div>
          <div class="stage-details">${stage.time}</div>
          <div class="stage-footer">
            <span><strong>${stage.priceText}</strong> | Limit ${stage.limit} per wallet</span>
            <span class="eligibility ${stage.eligible ? 'eligible' : 'not-eligible'}">
              ${stage.eligible ? 'Eligible ✓' : 'Not eligible'}
            </span>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function selectStage(stage) {
      selectedStage = stage;
      document.getElementById("displayStage").innerText = stage.name;
      document.getElementById("displayPrice").innerText = stage.priceText;
      document.getElementById("displayLimit").innerText = `${stage.limit} per wallet`;
      document.getElementById("mintQuantity").max = stage.limit;
      renderSchedule();
      updateTotal();
    }

    function updateTotal() {
      const qty = parseInt(document.getElementById("mintQuantity").value) || 1;
      const total = (qty * selectedStage.price).toFixed(4);
      document.getElementById("totalEth").innerText = total + " ETH";
    }

    async function connectWallet() {
      if (!window.ethereum) {
        alert("لطفاً افزونه متامسک را نصب کنید.");
        return;
      }
      try {
        provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        userAddress = await signer.getAddress();

        document.getElementById("walletAddress").innerText = userAddress.slice(0, 6) + "..." + userAddress.slice(-4);
        document.getElementById("connectBtn").innerText = "متصل شد";
        document.getElementById("connectBtn").style.background = "#21262d";
        
        const mintBtn = document.getElementById("mintButton");
        mintBtn.disabled = false;
        mintBtn.innerText = "مینت فوری از کانترکت SeaDrop ⚡";
      } catch (err) {
        showStatus("خطا در ولت: " + err.message, "error");
      }
    }

    async function executeMint() {
      if (!signer) return;
      if (selectedStage.status === "Ended") {
        showStatus("این فاز منقضی شده است. فاز Live now را انتخاب کنید.", "error");
        return;
      }

      const qty = parseInt(document.getElementById("mintQuantity").value);
      const totalCost = ethers.utils.parseEther((qty * selectedStage.price).toString());

      showStatus("در حال ارسال تراکنش مستقیم به شبکه اتریوم...", "info");

      try {
        const seaDrop = new ethers.Contract(SEADROP_ADDRESS, SEADROP_ABI, signer);

        const tx = await seaDrop.mintPublic(
          NFT_CONTRACT,
          ethers.constants.AddressZero,
          ethers.constants.AddressZero,
          qty,
          { value: totalCost }
        );

        showStatus("تراکنش فرستاده شد! هش: " + tx.hash, "info");
        await tx.wait();
        showStatus("مینت با موفقیت تایید شد! 🎉", "success");
      } catch (err) {
        showStatus("خطا در مینت: " + (err.reason || err.message), "error");
      }
    }

    function showStatus(msg, type) {
      const el = document.getElementById("status");
      el.className = type;
      el.innerText = msg;
      el.style.display = "block";
    }

    renderSchedule();
    updateTotal();
  </script>
</body>
</html>
